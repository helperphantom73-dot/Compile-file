name: Axon Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  CC: gcc

jobs:
  build-and-test:
    name: Build & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # cache: 'pip'  # غیرفعال شد تا نیاز به requirements.txt نباشد

    - name: 🛠️ Install System Dependencies (GCC, Make, OpenMP)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make libomp-dev

    - name: 📦 Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install llvmlite

    - name: 🚀 Run Axon Bundle (Generate, Build, Test)
      run: |
        python3 axon_bundle.py

    - name: 📤 Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: axon-binaries-py${{ matrix.python-version }}
        path: |
          *.bin
          !test_*.bin
        retention-days: 7

  cross-compile-arm64:
    name: Cross-Compile for ARM64
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        # cache: 'pip'  # غیرفعال شد

    - name: 🛠️ Install Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: 📦 Install Python Dependencies
      run: pip install llvmlite

    - name: 🏗️ Build Runtime for ARM64
      run: |
        make clean || true
        make runtime CC=aarch64-linux-gnu-gcc

    - name: 🚀 Compile Transformer for ARM64
      run: |
        python3 -m axon.cli build examples/transformer_block.axon --target aarch64-linux-gnu -o transformer_arm64.bin

    - name: 📤 Upload ARM64 Binary
      uses: actions/upload-artifact@v4
      with:
        name: axon-arm64-binary
        path: transformer_arm64.bin

  release:
    name: Create GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Download Binaries
      uses: actions/download-artifact@v4
      with:
        name: axon-binaries-py3.11
        path: ./binaries

    - name: 🏷️ Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./binaries/*.bin
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
